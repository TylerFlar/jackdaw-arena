# Local development and end-to-end tests.
#
#   docker compose up -d db            # Postgres for `uv run pytest` (api/)
#   docker compose --profile e2e up    # the whole stack plus Playwright (see web/e2e)
#
# Postgres 16 matches Aurora DSQL's PostgreSQL compatibility level.
name: jackdaw-arena

services:
  db:
    image: public.ecr.aws/docker/library/postgres:16
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
