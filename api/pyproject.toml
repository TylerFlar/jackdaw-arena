[project]
name = "arena-api"
version = "0.1.0"
description = "Jackdaw Arena: hosted, verifiable evaluation for Balatro agents"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
authors = [{name = "Tyler Flar"}]
dependencies = [
    "fastapi>=0.120",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    # The engine. A benchmark pins one release: its outcomes define the season.
    "jackdaw==0.2.0",
    "joserfc>=1.2",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.40",
    "uvicorn>=0.38",
]

[project.optional-dependencies]
# Production on AWS: Aurora DSQL (IAM auth tokens) and SSM. Installed in the Lambda image.
aws = [
    "aurora-dsql-python-connector>=0.2",
    "aurora-dsql-sqlalchemy>=1.3",
    "boto3>=1.40",
]

[project.scripts]
arena = "arena.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1",
    "respx>=0.22",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "arena"

[tool.uv.sources]
# jackdaw isn't on PyPI: install the release's prebuilt abi3 wheels (no Rust toolchain needed).
jackdaw = [
    { url = "https://github.com/TylerFlar/jackdaw-balatro/releases/download/v0.2.0/jackdaw-0.2.0-cp312-abi3-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/TylerFlar/jackdaw-balatro/releases/download/v0.2.0/jackdaw-0.2.0-cp312-abi3-manylinux_2_28_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { url = "https://github.com/TylerFlar/jackdaw-balatro/releases/download/v0.2.0/jackdaw-0.2.0-cp312-abi3-win_amd64.whl", marker = "sys_platform == 'win32'" },
    { url = "https://github.com/TylerFlar/jackdaw-balatro/releases/download/v0.2.0/jackdaw-0.2.0-cp312-abi3-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { url = "https://github.com/TylerFlar/jackdaw-balatro/releases/download/v0.2.0/jackdaw-0.2.0-cp312-abi3-macosx_10_12_x86_64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'x86_64'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--tb=short", "-m", "not dsql and not slow"]
markers = [
    "dsql: runs against a real Aurora DSQL cluster (ARENA_TEST_DSQL_ENDPOINT); run with -m dsql",
    "slow: long statistical runs (house baselines); run with -m slow",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
