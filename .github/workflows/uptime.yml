name: Uptime

# A failed run emails whoever last edited this schedule (GitHub's notification), on top of the
# CloudWatch alarms. GitHub pauses schedules in repositories with no activity for 60 days.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: vars.SITE_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The site, the API and the database answer
        env:
          SITE: ${{ vars.SITE_URL }}
        run: |
          for path in /healthz/deep /api/leaderboard /; do
            curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 20 \
              -o /dev/null -w "%{http_code} %{time_total}s $path\n" "$SITE$path"
          done
