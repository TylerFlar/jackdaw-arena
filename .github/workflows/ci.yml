name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arena -d arena"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      ARENA_TEST_DATABASE_URL: postgresql+psycopg://arena:arena@127.0.0.1:5432/arena_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Tests, including the slow statistical ones
        run: uv run pytest -m "not dsql"
      - name: The committed OpenAPI document matches the API
        run: |
          uv run arena openapi --out ../web/openapi.json
          git diff --exit-code -- ../web/openapi.json

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: client/uv.lock
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: The generated API types match openapi.json
        run: |
          pnpm exec openapi-typescript openapi.json -o src/api/schema.d.ts --default-non-nullable false
          git diff --exit-code -- src/api/schema.d.ts
      - run: pnpm test
      - run: pnpm build

  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - run: terraform fmt -check -recursive infra
      - name: Validate
        run: |
          for stack in bootstrap terraform; do
            terraform -chdir=infra/$stack init -backend=false -input=false
            terraform -chdir=infra/$stack validate
          done
      - name: Test (mocked AWS)
        run: terraform -chdir=infra/terraform test
      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads the AWS ruleset
        run: |
          tflint --chdir=infra/terraform --init
          tflint --chdir=infra/terraform
          tflint --chdir=infra/bootstrap --config="$PWD/infra/terraform/.tflint.hcl"
      - name: Lint the deploy script
        run: |
          pipx run --spec 'ruff==0.17.*' ruff check infra/scripts
          pipx run --spec 'ruff==0.17.*' ruff format --check infra/scripts
      - name: No CRLF line endings committed
        run: |
          if git ls-files --eol | grep 'i/crlf'; then
            echo "These files were committed with CRLF line endings."; exit 1
          fi

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Lambda image
        run: >-
          docker buildx build --platform linux/amd64 --provenance=false --load
          --build-arg BUILD=${{ github.sha }} --tag arena-api:ci api
      - name: The engine inside the image matches the local Gymnasium env
        run: docker run --rm --user root -v "$PWD/api:/api:ro" arena-api:ci sh /api/scripts/test-in-image.sh
      - name: The DSQL code path imports and builds an engine
        run: >-
          docker run --rm --entrypoint python arena-api:ci -c
          "from arena.db.engine import make_engine; from arena.settings import Settings;
          make_engine(Settings(db='dsql', dsql_endpoint='example.dsql.us-west-2.on.aws'))"
      - name: The image serves, and reports its build
        run: |
          docker run -d --name api -p 8000:8000 arena-api:ci
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/version | grep -F '"build":"${{ github.sha }}"'

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the site
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
      - name: Start the stack (Postgres, mock OpenID provider, API, Caddy)
        run: docker compose --profile e2e up -d --build --wait
      - name: Playwright
        working-directory: web
        run: pnpm e2e
      - name: Stack logs
        if: failure()
        run: docker compose --profile e2e logs --no-color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # Main only: the API's SQL against a real Aurora DSQL cluster (the scratch one), through the
  # CI role. Skipped until the repository variables exist.
  dsql:
    needs: api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_CI_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: dsql-ci # one run at a time: the tests wipe the cluster
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: uv sync --frozen --extra aws
      - run: uv run pytest -m dsql tests/test_dsql.py
        env:
          ARENA_TEST_DSQL_ENDPOINT: ${{ vars.DSQL_CI_ENDPOINT }}
